services:
  deaf-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_CMU_CLIENT_ID=${NEXT_PUBLIC_CMU_CLIENT_ID}
        - NEXT_PUBLIC_CMU_ENTRAID_URL=${NEXT_PUBLIC_CMU_ENTRAID_URL}
        - NEXT_PUBLIC_CMU_ENTRAID_LOGOUT_URL=${NEXT_PUBLIC_CMU_ENTRAID_LOGOUT_URL}
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
    container_name: deaf-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    # ส่วนที่ต้องมีเพื่อให้ต่อกับ Supabase ได้
    networks:
      - supabase_network_supabase

# --- เพิ่มส่วนนี้ไว้ท้ายสุดของไฟล์ ---
networks:
  supabase_network_supabase:
    external: true