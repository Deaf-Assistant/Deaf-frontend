services:
  nextjs:
    container_name: deaf-assistant
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_CMU_CLIENT_ID: ${NEXT_PUBLIC_CMU_CLIENT_ID}
        NEXT_PUBLIC_CMU_ENTRAID_URL: ${NEXT_PUBLIC_CMU_ENTRAID_URL}
        NEXT_PUBLIC_CMU_ENTRAID_LOGOUT_URL: ${NEXT_PUBLIC_CMU_ENTRAID_LOGOUT_URL}

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      - SUPABASE_URL_INTERNAL
      - SUPABASE_SERVICE_ROLE_KEY
      - JWT_SECRET
      - CMU_ENTRAID_CLIENT_SECRET
      - CMU_ENTRAID_GET_TOKEN_URL
      - CMU_ENTRAID_GET_BASIC_INFO
      - SCOPE
      - CMU_ENTRAID_REDIRECT_URL=http://localhost:3000/cmuEntraIDCallback
    

    networks:
      - supabase_default

networks:
  supabase_default:
    external: true